<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onkel Flávio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Das Handy: Rahmen, Bildschirm, Home-Knopf -->
  <div class="device">
    <div class="speaker" aria-hidden="true"></div>
    <div class="screen">
      <div class="statusbar">
        <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>BeatNet</span>
        <span id="clock" class="clock"></span>
        <span class="batt" aria-hidden="true"><i></i></span>
      </div>

      <!-- Startbildschirm (erster Start) -->
      <section id="start" class="start hidden">
        <p class="eyebrow">Ein Musik-Spiel</p>
        <h1>Onkel Flávio</h1>
        <p>Berlin, ein altes Handy, ein billiges Mikro – und dein Onkel Flávio, der ab heute dein Manager ist.
          Nimm Songs auf, bring sie raus, bau dir Fans auf und schaff es bis in die Charts.</p>
        <label for="name">Dein Künstlername</label>
        <input id="name" maxlength="24" autocomplete="off" placeholder="z. B. Flávinho" />
        <label for="genre">Dein Genre</label>
        <select id="genre"></select>
        <button id="start-btn" class="btn primary wide">Handy entsperren</button>
        <p class="fine">Alle Künstler, Labels und Apps im Spiel sind erfunden.</p>
      </section>

      <main id="view" class="hidden"></main>

      <div id="flash" class="flash hidden"></div>
      <input id="file" type="file" accept="image/*" hidden />

      <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
          <h2 id="m-title"></h2>
          <div id="m-body"></div>
          <button id="m-ok" class="btn primary wide">OK</button>
        </div>
      </div>
    </div>
    <button class="home-btn" data-page="home" aria-label="Zum Startbildschirm"><i></i></button>
  </div>

  <script src="game.js"></script>
</body>
</html>
