<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onkel Flávio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Startbildschirm -->
  <section id="start" class="start hidden">
    <div class="start-card">
      <p class="eyebrow">Ein Kiez-Spiel</p>
      <h1>Onkel Flávio</h1>
      <p>Kreuzberg. Du hast 50 Euro, ein altes Handy und eine Nummer: die von Onkel Flávio.
        Er sucht jemanden, der Sachen von A nach B bringt. Fang klein an – und werde größer.</p>
      <label for="name">Wie nennen sie dich im Kiez?</label>
      <input id="name" maxlength="20" autocomplete="off" placeholder="z. B. Kalle" />
      <button id="start-btn" class="btn primary wide">Loslegen</button>
      <p class="fine">Erfundene Geschichte, erfundene Ware. Ein Spiel – keine Anleitung.</p>
    </div>
  </section>

  <!-- Spiel -->
  <main id="game" class="hidden">
    <header class="bar">
      <div class="bar-top">
        <strong class="brand">Onkel Flávio</strong>
        <span id="clock"></span>
      </div>
      <div class="bar-stats">
        <div><small>Geld</small><b id="s-cash"></b></div>
        <div><small>Ruf</small><b id="s-rep"></b></div>
        <div><small>Rang</small><b id="s-rank"></b></div>
        <div><small>Heat</small><b id="s-heat"></b></div>
      </div>
      <div class="heat"><i id="heat-fill"></i></div>
    </header>

    <section id="view"></section>

    <footer class="foot">
      <button id="wait" class="btn primary wide">Abwarten · nächste Tageszeit</button>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="m-title"></h2>
      <div id="m-body"></div>
      <button id="m-ok" class="btn primary wide">OK</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
